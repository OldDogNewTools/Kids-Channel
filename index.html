<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kids TV">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b2340">
<title>Kids TV</title>
<style>
  :root {
    --bg: #1b2340; --card: #2a3460; --text: #ffffff; --muted: #b9c2e6;
    --accent: #ffcc33; --danger: #ff5c5c; --ok: #4cd18a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px)
    calc(env(safe-area-inset-bottom) + 24px) calc(env(safe-area-inset-left) + 14px);
    -webkit-user-select: none; user-select: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  input { font: inherit; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  header h1 { flex: 1; margin: 0; font-size: 28px; }
  #lockBtn { background: transparent; font-size: 22px; opacity: .45; padding: 8px; }
  #search { width: 100%; font-size: 22px; padding: 14px 18px; border-radius: 30px; border: 0;
    background: #fff; color: #222; margin-bottom: 18px; -webkit-user-select: text; user-select: text; }
  h2 { font-size: 22px; margin: 18px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .tile { background: var(--card); border-radius: 18px; overflow: hidden; text-align: left;
    padding: 0; display: flex; flex-direction: column; min-height: 150px; }
  .tile:active { transform: scale(.97); }
  .thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #111; }
  .bigicon { width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
    font-size: 54px; }
  .tile .name { padding: 10px 12px; font-size: 18px; font-weight: 600; line-height: 1.2; }
  .empty { color: var(--muted); font-size: 18px; padding: 10px 2px; }

  /* Player */
  #player { position: fixed; inset: 0; background: #000; z-index: 70; display: none; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #player.open { display: flex; }
  #playerBar { display: flex; align-items: center; gap: 12px; padding: 10px; }
  #backBtn { background: var(--accent); color: #222; font-size: 22px; font-weight: 700;
    padding: 12px 22px; border-radius: 30px; }
  #playerTitle { font-size: 20px; font-weight: 600; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #frameWrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  #frameWrap iframe { width: 100%; height: 100%; max-height: 100%; border: 0; }

  /* Overlays */
  .overlay { position: fixed; inset: 0; background: rgba(10,14,30,.96); z-index: 60; display: none;
    overflow-y: auto; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 30px); }
  .overlay.open { display: block; }
  .panel { max-width: 640px; margin: 0 auto; }
  .row { display: flex; gap: 10px; align-items: center; }
  .btn { background: var(--card); padding: 12px 16px; border-radius: 12px; font-size: 17px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #222; }
  .btn.danger { background: var(--danger); }
  .btn.small { padding: 8px 12px; font-size: 15px; }
  .field { width: 100%; padding: 12px; border-radius: 10px; border: 0; font-size: 17px; margin: 6px 0 12px;
    -webkit-user-select: text; user-select: text; }
  label { font-size: 15px; color: var(--muted); }
  .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 12px 0; }
  .msg { min-height: 22px; font-size: 16px; margin: 6px 0; }
  .msg.err { color: var(--danger); } .msg.ok { color: var(--ok); }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #3a4578; }
  .item:last-child { border-bottom: 0; }
  .item .t { flex: 1; font-size: 16px; }
  .item small { color: var(--muted); display: block; }
  .item img, .item .ic { width: 64px; height: 36px; border-radius: 6px; object-fit: cover; flex: none;
    display: flex; align-items: center; justify-content: center; background: #111; font-size: 22px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 320px; margin: 16px auto; }
  .pad button { background: var(--card); font-size: 28px; padding: 16px 0; border-radius: 14px; }
  .question { text-align: center; font-size: 34px; font-weight: 700; margin-top: 30px; }
  .answer { text-align: center; font-size: 34px; min-height: 46px; margin-top: 10px; letter-spacing: 2px; }
  textarea.field { min-height: 90px; font-size: 13px; font-family: ui-monospace, Menlo, monospace; }
  .seg { display: flex; gap: 8px; margin: 8px 0 14px; }
  .seg button { flex: 1; }
  .seg button.on { background: var(--accent); color: #222; }
  .help { color: var(--muted); font-size: 14px; line-height: 1.4; }
</style>
</head>
<body>

<header>
  <h1>📺 Kids TV</h1>
  <button id="lockBtn" aria-label="Grown-ups">🔒</button>
</header>

<input id="search" type="search" placeholder="🔍  Find a show" autocomplete="off" autocorrect="off" spellcheck="false">

<section id="favSection">
  <h2>⭐ Favorites</h2>
  <div id="favGrid" class="grid"></div>
</section>
<section id="showSection">
  <h2>📚 Shows</h2>
  <div id="showGrid" class="grid"></div>
</section>
<div id="noResults" class="empty" style="display:none">No match. Try another word.</div>

<!-- Player -->
<div id="player">
  <div id="playerBar">
    <button id="backBtn">⬅ Back</button>
    <div id="playerTitle"></div>
  </div>
  <div id="frameWrap"></div>
</div>

<!-- Math gate -->
<div id="gate" class="overlay">
  <div class="panel">
    <div class="row"><button class="btn" id="gateCancel">✕ Close</button></div>
    <div class="question" id="gateQ"></div>
    <div class="answer" id="gateA"></div>
    <div class="pad" id="gatePad"></div>
  </div>
</div>

<!-- Parent area -->
<div id="parent" class="overlay">
  <div class="panel">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">Grown-up settings</h2>
      <button class="btn primary" id="parentDone">Done</button>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Add something</h3>
      <div class="seg" id="addType">
        <button class="btn on" data-type="video">One video</button>
        <button class="btn" data-type="show">Whole show / channel</button>
      </div>
      <label for="addLink">Paste the YouTube link</label>
      <input class="field" id="addLink" placeholder="https://youtu.be/..." autocapitalize="off" autocorrect="off">
      <label for="addName">Name he will see (use the name he calls it)</label>
      <input class="field" id="addName" placeholder="e.g. Planets song">
      <label for="addWords">Extra search words (optional)</label>
      <input class="field" id="addWords" placeholder="e.g. space, sun, rocket">
      <div id="iconRow">
        <label for="addIcon">Picture for the show button (one emoji)</label>
        <input class="field" id="addIcon" placeholder="e.g. 🚀" maxlength="4">
      </div>
      <div id="favRow" class="row" style="margin-bottom:12px">
        <input type="checkbox" id="addFav" checked style="width:24px;height:24px">
        <label for="addFav" style="color:#fff;font-size:17px">Put in ⭐ Favorites</label>
      </div>
      <button class="btn primary" id="addBtn">Add</button>
      <div class="msg" id="addMsg"></div>
      <p class="help" id="addHelp"></p>
    </div>

    <div class="card">
      <h3 style="margin-top:0">What he can watch</h3>
      <div id="manageList"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Options</h3>
      <div class="row">
        <input type="checkbox" id="optRepeat" style="width:24px;height:24px">
        <label for="optRepeat" style="color:#fff;font-size:17px">Single videos replay automatically</label>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Backup</h3>
      <p class="help">Copy this code and save it in Notes. Paste it back here to restore the list, or to copy it to another device.</p>
      <div class="row">
        <button class="btn small" id="copyBackup">Copy backup code</button>
        <button class="btn small" id="restoreBackup">Restore from code</button>
      </div>
      <textarea class="field" id="backupBox" placeholder="Backup code appears here"></textarea>
      <div class="msg" id="backupMsg"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- Starting list ----------
  // Channels are stored as their "uploads" playlist (channel ID with UC changed to UU).
  var DEFAULTS = {
    version: 1,
    repeat: false,
    items: [
      { id: "s1", kind: "show", name: "Danny Go!", words: "dance move exercise", icon: "🕺", list: "UU3wCAOfSB0W9iuKDDtNJeGw" },
      { id: "s2", kind: "show", name: "Vooks", words: "books story read", icon: "📖", list: "UUPaFAXsGaB84xIK0HbvSOuQ" },
      { id: "s3", kind: "show", name: "The Fixies", words: "fixies nolik simka", icon: "🔧", list: "UUYteOb8VQcy9IPW3k6RBqsA" },
      { id: "s4", kind: "show", name: "Justin Time", words: "justin olive squidgy", icon: "⏰", list: "UU0yZ2sAm9SVw9SahWP4y5Hw" }
    ]
  };
  var KEY = "kidsTV.v1";
  var COLORS = ["#e85d75", "#4a90e2", "#2bb673", "#f5a623", "#9b59b6", "#16a8b8", "#e67e22", "#6c7ae0"];

  // ---------- Storage ----------
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); if (d && Array.isArray(d.items)) return d; }
    } catch (e) {}
    return JSON.parse(JSON.stringify(DEFAULTS));
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var state = load();

  // ---------- Helpers ----------
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function norm(s) { return (s || "").toLowerCase().replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim(); }
  function thumbUrl(v) { return "https://i.ytimg.com/vi/" + v + "/hqdefault.jpg"; }
  function colorFor(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }

  // Turns a pasted YouTube link into {video} or {list}
  function parseLink(input) {
    var s = (input || "").trim();
    if (!s) return { error: "Paste a YouTube link first." };
    if (/^UC[\w-]{22}$/.test(s)) return { list: "UU" + s.slice(2) };
    if (/^(PL|UU|OL|FL)[\w-]{10,}$/.test(s)) return { list: s };
    if (/^[\w-]{11}$/.test(s)) return { video: s };
    var u;
    try { u = new URL(/^https?:\/\//i.test(s) ? s : "https://" + s); } catch (e) { return { error: "That doesn't look like a YouTube link." }; }
    var host = u.hostname.replace(/^www\.|^m\.|^music\./, "");
    if (!/(^|\.)youtube\.com$|^youtu\.be$|youtube-nocookie\.com$/.test(host)) return { error: "That isn't a YouTube link." };
    var path = u.pathname, m;
    var v = u.searchParams.get("v"), list = u.searchParams.get("list");
    if (host === "youtu.be") { m = path.match(/^\/([\w-]{11})/); if (m) return { video: m[1] }; }
    if (v && /^[\w-]{11}$/.test(v)) return { video: v };
    m = path.match(/^\/(shorts|embed|live|v)\/([\w-]{11})/); if (m) return { video: m[2] };
    if (list) return { list: list };
    m = path.match(/^\/channel\/(UC[\w-]{22})/); if (m) return { list: "UU" + m[1].slice(2) };
    if (/^\/(@|c\/|user\/)/.test(path)) return { error: "That is a channel NAME link. YouTube needs the channel ID instead (starts with UC). See the steps below." };
    return { error: "I couldn't find a video in that link." };
  }

  // ---------- Kid screen ----------
  function tileFor(item) {
    var b = el("button", "tile");
    if (item.kind === "video") {
      var img = el("img", "thumb"); img.alt = ""; img.loading = "lazy"; img.src = thumbUrl(item.video);
      b.appendChild(img);
    } else {
      var ic = el("div", "bigicon", item.icon || "📺");
      ic.style.background = colorFor(item.name);
      b.appendChild(ic);
    }
    b.appendChild(el("div", "name", item.name));
    b.addEventListener("click", function () { play(item); });
    return b;
  }

  function render() {
    var q = norm($("search").value);
    var words = q ? q.split(" ") : [];
    function matches(it) {
      if (!words.length) return true;
      var hay = norm(it.name + " " + (it.words || ""));
      return words.every(function (w) { return hay.indexOf(w) !== -1; });
    }
    var favs = state.items.filter(function (i) { return i.kind === "video" && i.fav && matches(i); });
    var shows = state.items.filter(function (i) { return (i.kind === "show" || (i.kind === "video" && !i.fav)) && matches(i); });
    var fg = $("favGrid"), sg = $("showGrid");
    fg.textContent = ""; sg.textContent = "";
    favs.forEach(function (i) { fg.appendChild(tileFor(i)); });
    shows.forEach(function (i) { sg.appendChild(tileFor(i)); });
    $("favSection").style.display = favs.length ? "" : "none";
    $("showSection").style.display = shows.length ? "" : "none";
    $("noResults").style.display = (!favs.length && !shows.length) ? "" : "none";
  }

  // ---------- Player ----------
  function play(item) {
    var base = "https://www.youtube-nocookie.com/embed/";
    var p = "rel=0&modestbranding=1&playsinline=1&autoplay=1&iv_load_policy=3&fs=1";
    var src;
    if (item.kind === "video") {
      src = base + item.video + "?" + p + (state.repeat ? "&loop=1&playlist=" + item.video : "");
    } else {
      src = base + "videoseries?list=" + encodeURIComponent(item.list) + "&" + p;
    }
    var f = document.createElement("iframe");
    f.src = src;
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.setAttribute("allowfullscreen", "");
    f.referrerPolicy = "strict-origin-when-cross-origin";
    var w = $("frameWrap"); w.textContent = ""; w.appendChild(f);
    $("playerTitle").textContent = item.name;
    $("player").classList.add("open");
  }
  function closePlayer() {
    $("player").classList.remove("open");
    $("frameWrap").textContent = "";   // stops the video
  }

  // ---------- Math gate ----------
  var gateAnswer = 0, gateTyped = "";
  function openGate() {
    var a = 12 + Math.floor(Math.random() * 8);   // 12-19
    var b = 3 + Math.floor(Math.random() * 7);    // 3-9
    gateAnswer = a * b; gateTyped = "";
    $("gateQ").textContent = a + " × " + b + " = ?";
    $("gateA").textContent = "";
    $("gate").classList.add("open");
  }
  function buildPad() {
    var keys = ["1","2","3","4","5","6","7","8","9","⌫","0","OK"];
    var pad = $("gatePad");
    keys.forEach(function (k) {
      var b = el("button", null, k);
      if (k === "OK") { b.style.background = "var(--accent)"; b.style.color = "#222"; }
      b.addEventListener("click", function () {
        if (k === "⌫") gateTyped = gateTyped.slice(0, -1);
        else if (k === "OK") {
          if (parseInt(gateTyped, 10) === gateAnswer) { $("gate").classList.remove("open"); openParent(); return; }
          openGate(); $("gateA").textContent = "Try again"; return;
        } else if (gateTyped.length < 4) gateTyped += k;
        $("gateA").textContent = gateTyped;
      });
      pad.appendChild(b);
    });
  }

  // ---------- Parent area ----------
  var addType = "video";
  var HELP = {
    video: "How to get a video link: in the YouTube app, open the video, tap Share, then Copy link. Come back here and paste it.",
    show: "How to add a whole channel: in Safari (not the YouTube app), go to youtube.com and open the channel. Tap the line under the channel name ('...more'), scroll down, tap Share channel, then Copy channel ID. Paste it here. A playlist link (with list= in it) also works."
  };
  function setAddType(t) {
    addType = t;
    Array.prototype.forEach.call($("addType").children, function (b) { b.classList.toggle("on", b.dataset.type === t); });
    $("iconRow").style.display = t === "show" ? "" : "none";
    $("favRow").style.display = t === "video" ? "" : "none";
    $("addLink").placeholder = t === "video" ? "https://youtu.be/..." : "UC... channel ID or playlist link";
    $("addHelp").textContent = HELP[t];
    $("addMsg").textContent = "";
  }
  function showMsg(id, text, ok) { var m = $(id); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); }

  function addItem() {
    var r = parseLink($("addLink").value);
    var name = $("addName").value.trim();
    if (r.error) return showMsg("addMsg", r.error, false);
    if (!name) return showMsg("addMsg", "Type a name for it.", false);
    if (addType === "video" && !r.video) return showMsg("addMsg", "That link is a playlist or channel. Switch to 'Whole show / channel'.", false);
    if (addType === "show" && !r.list) return showMsg("addMsg", "That link is a single video. Switch to 'One video'.", false);
    var dup = state.items.some(function (i) { return (r.video && i.video === r.video) || (r.list && i.list === r.list); });
    if (dup) return showMsg("addMsg", "That one is already in the list.", false);
    var item = { id: "i" + Date.now(), kind: addType, name: name, words: $("addWords").value.trim() };
    if (addType === "video") { item.video = r.video; item.fav = $("addFav").checked; }
    else { item.list = r.list; item.icon = $("addIcon").value.trim() || "📺"; }
    state.items.unshift(item); save(); renderManage(); render();
    $("addLink").value = ""; $("addName").value = ""; $("addWords").value = ""; $("addIcon").value = "";
    showMsg("addMsg", "Added \"" + name + "\".", true);
  }

  function renderManage() {
    var box = $("manageList"); box.textContent = "";
    if (!state.items.length) { box.appendChild(el("div", "empty", "Nothing yet.")); return; }
    state.items.forEach(function (it, idx) {
      var row = el("div", "item");
      if (it.kind === "video") { var img = el("img"); img.src = thumbUrl(it.video); img.alt = ""; row.appendChild(img); }
      else { var ic = el("div", "ic", it.icon || "📺"); ic.style.background = colorFor(it.name); row.appendChild(ic); }
      var t = el("div", "t", it.name);
      t.appendChild(el("small", null, it.kind === "video" ? (it.fav ? "⭐ Favorite video" : "Video") : "Whole show"));
      row.appendChild(t);
      var prev = el("button", "btn small", "▶"); prev.title = "Preview";
      prev.addEventListener("click", function () { play(it); });
      row.appendChild(prev);
      if (it.kind === "video") {
        var fav = el("button", "btn small", it.fav ? "★" : "☆"); fav.title = "Favorite";
        fav.addEventListener("click", function () { it.fav = !it.fav; save(); renderManage(); render(); });
        row.appendChild(fav);
      }
      var up = el("button", "btn small", "↑"); up.title = "Move up"; up.disabled = idx === 0;
      up.addEventListener("click", function () {
        var a = state.items; var tmp = a[idx - 1]; a[idx - 1] = a[idx]; a[idx] = tmp; save(); renderManage(); render();
      });
      row.appendChild(up);
      var del = el("button", "btn small danger", "✕"); del.title = "Remove";
      var armed = false;
      del.addEventListener("click", function () {
        if (!armed) { armed = true; del.textContent = "Sure?"; setTimeout(function () { armed = false; del.textContent = "✕"; }, 3000); return; }
        state.items.splice(idx, 1); save(); renderManage(); render();
      });
      row.appendChild(del);
      box.appendChild(row);
    });
  }

  function openParent() {
    $("optRepeat").checked = !!state.repeat;
    $("backupBox").value = ""; $("backupMsg").textContent = "";
    setAddType(addType); renderManage();
    $("parent").classList.add("open");
  }

  function makeBackup() { return btoa(unescape(encodeURIComponent(JSON.stringify(state)))); }
  function restore(code) {
    try {
      var d = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      if (!d || !Array.isArray(d.items)) throw 0;
      d.items = d.items.filter(function (i) {
        return i && typeof i.name === "string" &&
          ((i.kind === "video" && /^[\w-]{11}$/.test(i.video)) || (i.kind === "show" && /^[\w-]{10,}$/.test(i.list)));
      });
      state = { version: 1, repeat: !!d.repeat, items: d.items };
      save(); renderManage(); render(); $("optRepeat").checked = state.repeat;
      showMsg("backupMsg", "Restored " + state.items.length + " items.", true);
    } catch (e) { showMsg("backupMsg", "That code didn't work. Make sure you pasted all of it.", false); }
  }

  // ---------- Wire up ----------
  $("search").addEventListener("input", render);
  $("backBtn").addEventListener("click", closePlayer);
  $("lockBtn").addEventListener("click", openGate);
  $("gateCancel").addEventListener("click", function () { $("gate").classList.remove("open"); });
  $("parentDone").addEventListener("click", function () { closePlayer(); $("parent").classList.remove("open"); render(); });
  Array.prototype.forEach.call($("addType").children, function (b) { b.addEventListener("click", function () { setAddType(b.dataset.type); }); });
  $("addBtn").addEventListener("click", addItem);
  $("optRepeat").addEventListener("change", function () { state.repeat = $("optRepeat").checked; save(); });
  $("copyBackup").addEventListener("click", function () {
    var code = makeBackup(); $("backupBox").value = code;
    var done = function () { showMsg("backupMsg", "Copied. Paste it into Notes to keep it safe.", true); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, function () { $("backupBox").select(); showMsg("backupMsg", "Select the code above and copy it.", true); });
    else { $("backupBox").select(); showMsg("backupMsg", "Select the code above and copy it.", true); }
  });
  $("restoreBackup").addEventListener("click", function () {
    if (!$("backupBox").value.trim()) return showMsg("backupMsg", "Paste a backup code into the box first.", false);
    restore($("backupBox").value);
  });

  // When the player is open over the parent area (preview), Back returns to the parent area.
  buildPad();
  render();
})();
</script>
</body>
</html>
